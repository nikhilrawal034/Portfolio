<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        if (path && path !== '/' && path !== '/index.html') {
          var target = encodeURIComponent(path + window.location.search);
          window.location.replace('/?route=' + target + window.location.hash);
        } else {
          window.location.replace('/' + window.location.hash);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
